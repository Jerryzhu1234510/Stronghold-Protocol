  <script id="https-game-entry">
    // Run before the game connects. Old pages already in a match keep their
    // existing connection; the build guard sends them here after settlement.
    (function () {
      var source = window.location;
      var hosts = ['weishuxieyiwangye.cn'];
      if (source.protocol === 'http:' && hosts.indexOf(source.hostname.toLowerCase()) !== -1) {
        window.__SP_HTTPS_REDIRECTING = true;
        source.replace('https://weishuxieyiwangye.cn:8443/game.html' + source.search + source.hash);
      }
    }());
  </script>

<body>
  <div id="app"></div>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot__inner">
      <div class="boot__hex"></div>
      <div class="boot__text">STRONGHOLD PROTOCOL</div>
      <div id="boot-err" class="boot__err"></div>
      <button id="boot-retry" type="button" hidden onclick="location.reload()" style="margin-top:16px;padding:8px 20px;color:#bcf5e0;background:#132923;border:1px solid #4b8e78;font:inherit;cursor:pointer">重新加载</button>
    </div>
  </div>

  <div class="rotate-hint" role="alert">
    <div class="rotate-hint__phone"></div>
    <div class="rotate-hint__title">请将设备横屏</div>
    <div>卫戍协议：盟约 需要横屏显示以获得完整体验</div>
    <div class="rotate-hint__micro">ROTATE DEVICE</div>
    <button id="rotate-fullscreen" class="rotate-hint__button" type="button">全屏并横屏</button>
    <p id="rotate-status" class="rotate-hint__status" role="status">点击尝试全屏横屏；也可以开启手机自动旋转后，将手机横放。</p>
  </div>

  <noscript><p style="color:#c3cbc7;text-align:center;padding:40px">需要启用 JavaScript 才能运行本游戏。</p></noscript>
  <script>
    // ES5 diagnostics still run when the application cannot be parsed by an older browser.
    window.__spBootFail = function (why, detail) {
      var e = document.getElementById('boot-err');
      if (!e || e.getAttribute('data-final')) return;
      e.textContent = why === 'old'
        ? '当前浏览器内核不支持游戏脚本，请更新浏览器后重试。'
        : why === 'script' ? '游戏启动出错：' + String(detail || '未知错误').slice(0, 180)
        : '游戏脚本未能下载完成，请检查网络后重新加载。';
      e.setAttribute('data-final', '1');
      document.getElementById('boot-retry').hidden = false;
      window.__SP_BOOT_DIAGNOSTIC = { reason: why, detail: String(detail || ''), browser: navigator.userAgent };
    };
    window.addEventListener('error', function (ev) {
      var b = document.getElementById('boot');
      if (!b || b.classList.contains('is-done')) return;
      if (ev && ev.message) window.__spBootFail('script', ev.message);
    });
    window.addEventListener('unhandledrejection', function (ev) {
      var b = document.getElementById('boot'), reason = ev && ev.reason;
      if (!b || b.classList.contains('is-done') || !reason || /AbortError|NotAllowedError/.test(reason.name || '')) return;
      window.__spBootFail('script', reason.message || reason);
    });
  </script>
  <script defer src="/js/browser/main.js" onerror="window.__spBootFail && window.__spBootFail('load')"></script>
  <script>
    // If modules never boot (very old browser / blocked script), explain instead of spinning forever.
    setTimeout(function () {
      var b = document.getElementById('boot'), e = document.getElementById('boot-err');
      if (b && !b.classList.contains('is-done') && e && !e.textContent) {
        e.textContent = '游戏资源仍在加载；若一直停留在这里，请重新加载。';
        document.getElementById('boot-retry').hidden = false;
      }
    }, 9000);
  </script>
