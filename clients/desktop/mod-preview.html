<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>本地 Mod 预览室</title><link rel="stylesheet" href="mod-preview.css"></head>
<body><header><div><span class="eyebrow">STRONGHOLD / LOCAL STUDIO</span><h1>Mod 预览室</h1><p>试听音乐，检查外观，让干员动起来。</p></div><button id="refresh" type="button">刷新已安装包</button></header>
<main><aside><label for="mod">预览对象</label><select id="mod"><option value="">当前启用组合</option></select><p id="description" class="muted"></p><p id="source" class="tag"></p><p class="muted">选择某个包可试用未启用的效果。预览不会改变正式启用状态，也不会进入房间。</p><label for="volume">预览音量 <output id="volume-value">50%</output></label><input id="volume" type="range" min="0" max="100" value="50"><button id="stop-all" class="danger" type="button">停止全部声音与动作</button><p id="status" role="status" aria-live="polite">正在读取本地 Mod…</p></aside>
<div class="workspace"><section><div class="section-head"><h2>外观与动作</h2><span class="tag">2D 图片预览</span></div><div class="art-controls"><label>图片<select id="art"></select></label><label class="check"><input id="original" type="checkbox">对照原图</label><label class="check"><input id="motion" type="checkbox" checked>应用此包动作</label></div><div class="stage"><div class="stage-grid"></div><span class="floor-label">LOCAL PREVIEW / 无战斗数据</span><img id="sprite" alt="本地干员图片预览" hidden></div><p id="art-info" class="muted"></p><p id="motion-info" class="muted"></p><p class="note">图片替换会直接显示；骨骼、图集、字体文件只列出清单，完整小人装配请在训练场中验证。动作复用游戏的 2D 跳动、旋转和翻转接口。</p></section>
<section><div class="section-head"><h2>整局循环 BGM</h2><button id="session-play" type="button">开始循环</button><button id="session-stop" type="button">停止循环</button></div><p id="session-info" class="muted"></p></section>
<section><div class="section-head"><h2>音乐触发器</h2><span class="tag">20 个受控事件</span></div><p class="muted">点击试听该事件绑定的真实音频；这里跳过战斗触发条件，不会发送游戏事件。事件曲目结束后，循环 BGM 会恢复。</p><div id="events" class="event-grid"></div></section>
<section><h2>素材清单</h2><div id="files" class="file-list"></div></section></div></main>
<script src="unit-motion.cjs"></script><script src="session-music.cjs"></script><script src="mod-preview.js"></script></body></html>
